<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의견 남기기 & AI 피드백</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; padding: 15px; background-color: #f4f4f4; border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>💬 앱 피드백 및 AI 답변</h2>
  <textarea id="promptInput" placeholder="앱에 대한 의견이나 질문을 남겨주세요..."></textarea>
  <br>
  <button id="sendBtn" onclick="sendPrompt()">전송하기</button>

  <h3>AI 답변:</h3>
  <div id="result">답변이 여기에 표시됩니다.</div>

  <script>
    async function sendPrompt() {
      const promptInput = document.getElementById('promptInput');
      const resultDiv = document.getElementById('result');
      const sendBtn = document.getElementById('sendBtn');

      const prompt = promptInput.value.trim();
      if (!prompt) return alert('내용을 입력해주세요.');

      sendBtn.disabled = true;
      resultDiv.innerText = 'Gemini가 생각 중입니다...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });

        const data = await res.json();
        if (res.ok) {
          resultDiv.innerText = data.result;
        } else {
          resultDiv.innerText = '오류: ' + (data.error || '알 수 없는 오류');
        }
      } catch (err) {
        resultDiv.innerText = '통신 오류가 발생했습니다.';
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
