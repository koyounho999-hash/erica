<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 타임테이블 도우미</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-blue-50/50 min-h-screen text-slate-800 flex flex-col p-4 md:p-6">

  <!-- Header -->
  <header class="max-w-7xl w-full mx-auto mb-6 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-blue-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-200">
        <i class="fa-solid fa-calendar-check text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">TimePlanner AI</h1>
        <p class="text-xs text-blue-500 font-medium">편안한 하루를 위한 AI 타임테이블</p>
      </div>
    </div>
    <button id="enableNotification" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-2 rounded-xl font-medium transition flex items-center gap-2">
      <i class="fa-regular fa-bell"></i> 알림 켜기
    </button>
  </header>

  <!-- Main Layout -->
  <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col gap-6">
    
    <!-- 1. 상단 입력창 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-blue-100">
      <form id="scheduleForm" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="promptInput" 
            placeholder="예: '오늘 공부 및 운동 일정을 아침 9시부터 저녁 6시까지 짜줘'" 
            class="w-full px-4 py-3.5 pl-11 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white text-slate-700 transition"
            required
          />
          <i class="fa-solid fa-wand-magic-sparkles absolute left-4 top-1/2 -translate-y-1/2 text-blue-400"></i>
        </div>
        <button 
          type="submit" 
          id="submitBtn"
          class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-6 py-3.5 rounded-xl shadow-md shadow-blue-200 hover:shadow-lg transition flex items-center justify-center gap-2"
        >
          <span>일정 생성하기</span>
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </section>

    <!-- 2. 하단 출력창 (2분할) -->
    <section class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[500px]">
      
      <!-- 왼쪽: 타임테이블 (5열) -->
      <div class="lg:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-blue-100 flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-clock text-blue-500"></i> 오늘의 타임테이블
          </h2>
          <span id="activeCount" class="text-xs bg-blue-100 text-blue-600 px-2.5 py-1 rounded-full font-semibold">0개 등록됨</span>
        </div>
        
        <div id="timetableList" class="flex-1 overflow-y-auto space-y-3 pr-1 max-h-[550px]">
          <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
            <i class="fa-regular fa-calendar-plus text-4xl mb-3 text-blue-200"></i>
            <p class="text-sm">상단에 요청을 입력하면 타임테이블이 생성됩니다.</p>
          </div>
        </div>
      </div>

      <!-- 오른쪽: AI 상세 설명 (7열) -->
      <div class="lg:col-span-7 bg-white p-5 rounded-2xl shadow-sm border border-blue-100 flex flex-col">
        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
          <i class="fa-solid fa-robot text-blue-500"></i>
          <h2 class="text-lg font-bold text-slate-800">AI 추천 & 상세 안내</h2>
        </div>
        
        <div id="aiDescription" class="flex-1 overflow-y-auto text-slate-700 leading-relaxed space-y-2 whitespace-pre-wrap max-h-[550px] p-2">
          <p class="text-slate-400 text-center py-12 text-sm">생성된 AI의 가이드라인과 팁이 이곳에 표시됩니다.</p>
        </div>
      </div>

    </section>
  </main>

  <script>
    const form = document.getElementById('scheduleForm');
    const promptInput = document.getElementById('promptInput');
    const submitBtn = document.getElementById('submitBtn');
    const aiDescription = document.getElementById('aiDescription');
    const timetableList = document.getElementById('timetableList');
    const activeCount = document.getElementById('activeCount');
    const enableNotificationBtn = document.getElementById('enableNotification');

    let currentSchedules = [];
    let alertedTimes = new Set();

    // 알림 권한 요청
    enableNotificationBtn.addEventListener('click', () => {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('브라우저 알림 권한이 승인되었습니다!');
          }
        });
      }
    });

    // 폼 제출 시 스트리밍 API 호출
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      // UI 초기화 및 로딩 상태
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 생성 중...`;
      aiDescription.innerHTML = '';
      timetableList.innerHTML = `<div class="p-4 text-center text-blue-500"><i class="fa-solid fa-spinner animate-spin text-2xl"></i><p class="mt-2 text-sm">일정을 구성하는 중...</div>`;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });

        if (!response.ok) throw new Error('API 호출 실패');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          fullText += chunk;

          // 설명창에 라이브 텍스트 렌더링
          aiDescription.innerText = fullText.replace(/```json[\s\S]*?```/g, '');
        }

        // JSON 추출 및 타임테이블 파싱
        parseAndRenderTimetable(fullText);

      } catch (err) {
        aiDescription.innerHTML = `<p class="text-red-500">오류가 발생했습니다: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>일정 생성하기</span> <i class="fa-solid fa-paper-plane text-sm"></i>`;
      }
    });

    // 타임테이블 파싱 및 렌더링
    function parseAndRenderTimetable(text) {
      const jsonMatch = text.match(/```json\s*([\s\S]*?)\s*```/);
      if (jsonMatch && jsonMatch[1]) {
        try {
          currentSchedules = JSON.parse(jsonMatch[1]);
          alertedTimes.clear();
          renderTimetable();
        } catch (e) {
          console.error('JSON 파싱 실패:', e);
        }
      }
    }

    function renderTimetable() {
      if (currentSchedules.length === 0) return;

      timetableList.innerHTML = '';
      activeCount.innerText = `${currentSchedules.length}개 등록됨`;

      currentSchedules.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "flex items-center p-3.5 rounded-xl bg-slate-50 border border-blue-100 hover:bg-blue-50/60 transition group";
        card.innerHTML = `
          <div class="font-bold text-blue-600 bg-white px-3 py-1.5 rounded-lg border border-blue-200 text-sm shadow-sm">
            ${item.time}
          </div>
          <div class="ml-3 flex-1 font-medium text-slate-700 group-hover:text-blue-900">
            ${item.task}
          </div>
          <div class="w-2.5 h-2.5 rounded-full bg-blue-300"></div>
        `;
        timetableList.appendChild(card);
      });
    }

    // 알람 체크 루프 (10초마다 실행)
    setInterval(() => {
      if (currentSchedules.length === 0) return;

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeStr = `${hours}:${minutes}`;

      currentSchedules.forEach(item => {
        if (item.time === currentTimeStr && !alertedTimes.has(item.time)) {
          alertedTimes.add(item.time);
          triggerAlarm(item.time, item.task);
        }
      });
    }, 10000);

    // 알림 및 브라우저 Notification 발송
    function triggerAlarm(time, task) {
      // 1. 브라우저 데스크톱 알림
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`⏰ [${time}] 할 일 알림`, {
          body: task,
          icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png'
        });
      }

      // 2. 인앱 알림 alert
      alert(`⏰ [${time}] 예정된 일정입니다!\n\n▶ ${task}`);
    }
  </script>
</body>
</html>
